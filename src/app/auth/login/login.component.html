<div class="login-container">
  <div class="login-box-wrapper">
    <!-- Brand Emblem -->
    <div class="brand-header">
      <div class="brand-badge">
        <mat-icon>dashboard_customize</mat-icon>
      </div>
      <h1 class="brand-name">DONM Enterprise</h1>
      <p class="brand-sub">Distributed Office Network Manager</p>
    </div>

    <!-- Login Card -->
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Sign in to your account</mat-card-title>
        <mat-card-subtitle>Enter your system credentials to access the workspace</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
          
          <div *ngIf="errorMsg" class="error-msg">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMsg }}</span>
          </div>

          <mat-form-field appearance="outline">
            <mat-label>Email address</mat-label>
            <input matInput type="email" name="email" required [(ngModel)]="email" placeholder="admin@network.gov">
            <mat-icon matSuffix class="field-icon">mail_outline</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" name="password" required [(ngModel)]="password" placeholder="••••••••">
            <mat-icon matSuffix class="field-icon">lock_outline</mat-icon>
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="!loginForm.form.valid || isLoading">
            <span *ngIf="!isLoading">Sign In</span>
            <span *ngIf="isLoading">Verifying credentials...</span>
          </button>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="login-footer">
      <span>Offline-first encryption active · Local storage secured</span>
    </div>
  </div>
</div>
