version: '3.8'

services:
  officnetworkmanager:
    container_name: officnetworkmanager
    build:
      context: .
      dockerfile: Dockerfile
    image: officnetworkmanager:latest
    restart: always
    ports:
      - "4200:80"
      - "8088:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
